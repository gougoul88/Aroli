<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroli Story Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            flex: 1;
        }

        .lang-toggle {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: white;
            color: #667eea;
        }

        .lang-btn:hover {
            background: rgba(255,255,255,0.5);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9em;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .file-upload {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .file-upload:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .file-upload.has-file {
            border-color: #4caf50;
            background: #f1f8f5;
        }

        .file-upload input {
            display: none;
        }

        .file-name {
            color: #4caf50;
            font-weight: 600;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .current-file {
            color: #666;
            font-size: 0.85em;
            margin-top: 5px;
            font-style: italic;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-group label {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-delete {
            background: linear-gradient(135deg, #f44336 0%, #e53935 100%);
            width: auto;
            padding: 6px 14px;
            font-size: 0.85em;
        }

        .btn-edit {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            width: auto;
            padding: 6px 14px;
            font-size: 0.85em;
        }

        .btn-download {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 0.9em;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .story-list {
            overflow-x: auto;
        }

        .stories-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .stories-table thead {
            background: #f0f2ff;
            border-bottom: 2px solid #667eea;
        }

        .stories-table th {
            padding: 12px;
            text-align: left;
            color: #667eea;
            font-weight: 600;
        }

        .stories-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .stories-table tbody tr {
            transition: background 0.3s ease;
        }

        .stories-table tbody tr:hover {
            background: #f8f9ff;
        }

        .story-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .badge.ai {
            background: #fff3e0;
            color: #e65100;
        }

        .badge.language {
            background: #e3f2fd;
            color: #0d47a1;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .version-section {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .modal-header h3 {
            color: #667eea;
            font-size: 1.2em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
            width: auto;
            padding: 0;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 1.8em;
            font-weight: bold;
            display: block;
        }

        .stat-card .label {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Aroli Story Manager</h1>
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">English</button>
                <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')">Français</button>
            </div>
        </header>

        <div class="layout">
            <!-- Add/Edit Story Card -->
            <div class="card">
                <h2 id="title-form">➕ Add Story</h2>
                
                <div id="alert" class="alert"></div>

                <form id="storyForm">
                    <div class="form-group">
                        <label for="storyTitle" data-i18n="label-title">Title *</label>
                        <input type="text" id="storyTitle" placeholder="The Little Prince" required>
                    </div>

                    <div class="two-col">
                        <div class="form-group">
                            <label for="storyLanguage" data-i18n="label-language">Language</label>
                            <select id="storyLanguage">
                                <option value="fr">Français</option>
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="de">Deutsch</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="publishedDate" data-i18n="label-date">Published Date</label>
                            <input type="date" id="publishedDate">
                        </div>
                    </div>

                    <div class="two-col">
                        <div class="form-group">
                            <label for="ageMin" data-i18n="label-age-min">Age Min</label>
                            <input type="number" id="ageMin" min="0" max="18">
                        </div>

                        <div class="form-group">
                            <label for="ageMax" data-i18n="label-age-max">Age Max</label>
                            <input type="number" id="ageMax" min="0" max="18">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="audioFile" data-i18n="label-audio">Audio File (MP3/WAV) *</label>
                        <div class="file-upload" id="audioUpload">
                            <span data-i18n="upload-drag">📁 Click or drag audio file</span>
                            <input type="file" id="audioFile" accept=".mp3,.wav,.m4a" required>
                            <div class="file-name" id="audioName"></div>
                            <div class="current-file" id="currentAudio"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="imageFile" data-i18n="label-image">Cover Image (PNG/JPG) *</label>
                        <div class="file-upload" id="imageUpload">
                            <span data-i18n="upload-drag">🖼️ Click or drag image</span>
                            <input type="file" id="imageFile" accept=".png,.jpg,.jpeg,.gif,.webp" required>
                            <div class="file-name" id="imageName"></div>
                            <div class="current-file" id="currentImage"></div>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="isAi">
                            <span data-i18n="label-ai">AI Generated Story</span>
                        </label>
                    </div>

                    <div class="version-section">
                        <div class="form-group">
                            <label for="appVersion" data-i18n="label-version">App Version (optional)</label>
                            <input type="text" id="appVersion" placeholder="1.1">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" data-i18n="btn-add">Add Story</button>
                    <button type="button" id="btn-cancel" class="hidden" data-i18n="btn-cancel" onclick="cancelEdit()">Cancel</button>
                </form>
            </div>

            <!-- Stories List Card -->
            <div class="card">
                <h2 id="title-list">📚 Stories</h2>

                <div class="stats">
                    <div class="stat-card">
                        <span class="number" id="totalStories">0</span>
                        <span class="label" data-i18n="stat-total">Total</span>
                    </div>
                    <div class="stat-card">
                        <span class="number" id="aiStories">0</span>
                        <span class="label" data-i18n="stat-ai">AI</span>
                    </div>
                    <div class="stat-card">
                        <span class="number" id="appVersion">1.0</span>
                        <span class="label" data-i18n="stat-version">Version</span>
                    </div>
                </div>

                <div id="storiesList" class="story-list">
                    <div class="empty-state" data-i18n="empty-state">No stories yet. Add your first story!</div>
                </div>

                <button class="btn-download" id="btn-download" data-i18n="btn-download" onclick="downloadManifest()">📥 Download manifest.json</button>
            </div>
        </div>
    </div>

    <script>
        // Translations
        const translations = {
            en: {
                'title-form': '➕ Add Story',
                'title-list': '📚 Stories',
                'label-title': 'Title *',
                'label-language': 'Language',
                'label-date': 'Published Date',
                'label-age-min': 'Age Min',
                'label-age-max': 'Age Max',
                'label-audio': 'Audio File (MP3/WAV) *',
                'label-image': 'Cover Image (PNG/JPG) *',
                'label-ai': 'AI Generated Story',
                'label-version': 'App Version (optional)',
                'upload-drag': '📁 Click or drag file',
                'btn-add': 'Add Story',
                'btn-cancel': 'Cancel',
                'btn-delete': '🗑️ Delete',
                'btn-close': 'Close',
                'btn-download': '📥 Download manifest.json',
                'stat-total': 'Total',
                'stat-ai': 'AI',
                'stat-version': 'Version',
                'empty-state': 'No stories yet. Add your first story!',
                'success-add': '✅ Story added successfully!',
                'success-update': '✅ Story updated successfully!',
                'success-delete': '✅ Story deleted successfully!',
                'error-required': '❌ Please fill all required fields',
                'error-files': '❌ Please select files',
                'error-server': '❌ Server error. Make sure http://localhost:3000 is running'
            },
            fr: {
                'title-form': '➕ Ajouter une Histoire',
                'title-list': '📚 Histoires',
                'label-title': 'Titre *',
                'label-language': 'Langue',
                'label-date': 'Date de publication',
                'label-age-min': 'Âge min',
                'label-age-max': 'Âge max',
                'label-audio': 'Fichier Audio (MP3/WAV) *',
                'label-image': 'Image de couverture (PNG/JPG) *',
                'label-ai': 'Histoire générée par IA',
                'label-version': 'Version de l\'app (optionnel)',
                'upload-drag': '📁 Cliquez ou déposez le fichier',
                'btn-add': 'Ajouter l\'histoire',
                'btn-cancel': 'Annuler',
                'btn-delete': '🗑️ Supprimer',
                'btn-close': 'Fermer',
                'btn-download': '📥 Télécharger manifest.json',
                'stat-total': 'Total',
                'stat-ai': 'IA',
                'stat-version': 'Version',
                'empty-state': 'Aucune histoire. Ajoutez la première!',
                'success-add': '✅ Histoire ajoutée avec succès!',
                'success-update': '✅ Histoire modifiée avec succès!',
                'success-delete': '✅ Histoire supprimée avec succès!',
                'error-required': '❌ Veuillez remplir tous les champs obligatoires',
                'error-files': '❌ Veuillez sélectionner les fichiers',
                'error-server': '❌ Erreur serveur. Assurez-vous que http://localhost:3000 tourne'
            }
        };

        let currentLanguage = 'en';
        let stories = [];
        let editingStoryId = null;
        let manifestVersion = '1.0';
        const API_BASE = 'http://localhost:3000/api';

        function setLanguage(lang) {
            currentLanguage = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            updateI18n();
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show ${type}`;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        function t(key) {
            return translations[currentLanguage][key] || key;
        }

        function updateI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (el.tagName === 'BUTTON') {
                    el.textContent = translations[currentLanguage][key] || key;
                } else {
                    el.textContent = translations[currentLanguage][key] || key;
                }
            });
        }

        // Set today's date
        document.getElementById('publishedDate').valueAsDate = new Date();

        // File upload handlers
        function setupFileUpload(uploadDiv, fileInput, nameDisplay, currentDisplay) {
            fileInput.addEventListener('change', () => {
                if (fileInput.files[0]) {
                    uploadDiv.classList.add('has-file');
                    nameDisplay.textContent = '✅ ' + fileInput.files[0].name;
                }
            });

            uploadDiv.addEventListener('click', () => {
                if (currentDisplay.textContent && editingStoryId) {
                    // Confirm replacement
                    if (!confirm(currentLanguage === 'en' ? 'Replace this file?' : 'Remplacer ce fichier?')) {
                        return;
                    }
                }
                fileInput.click();
            });

            uploadDiv.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadDiv.style.background = '#e8ebff';
            });

            uploadDiv.addEventListener('dragleave', () => {
                uploadDiv.style.background = '';
            });

            uploadDiv.addEventListener('drop', (e) => {
                e.preventDefault();
                fileInput.files = e.dataTransfer.files;
                fileInput.dispatchEvent(new Event('change'));
            });
        }

        setupFileUpload(
            document.getElementById('audioUpload'),
            document.getElementById('audioFile'),
            document.getElementById('audioName'),
            document.getElementById('currentAudio')
        );

        setupFileUpload(
            document.getElementById('imageUpload'),
            document.getElementById('imageFile'),
            document.getElementById('imageName'),
            document.getElementById('currentImage')
        );

        // Auto-generate story ID from audio filename
        document.getElementById('audioFile').addEventListener('change', (e) => {
            if (e.target.files[0] && !editingStoryId) {
                const filename = e.target.files[0].name;
                const nameWithoutExt = filename.replace(/\.[^/.]+$/, '');
                const timestamp = Math.floor(Date.now() / 1000);
                // Store as data attribute since ID is hidden
                document.getElementById('storyForm').dataset.storyId = `${nameWithoutExt}-${timestamp}`;
            }
        });

        // Form submission
        document.getElementById('storyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('storyTitle').value;
            const audioFile = document.getElementById('audioFile').files[0];
            const imageFile = document.getElementById('imageFile').files[0];

            if (!title) {
                showAlert(t('error-required'), 'error');
                return;
            }

            if (!editingStoryId && (!audioFile || !imageFile)) {
                showAlert(t('error-files'), 'error');
                return;
            }

            const storyData = {
                title: title,
                language: document.getElementById('storyLanguage').value,
                ai: document.getElementById('isAi').checked,
                publishedDate: document.getElementById('publishedDate').value
            };

            const ageMin = document.getElementById('ageMin').value;
            const ageMax = document.getElementById('ageMax').value;
            if (ageMin) storyData.ageMin = parseInt(ageMin);
            if (ageMax) storyData.ageMax = parseInt(ageMax);

            const appVersion = document.getElementById('appVersion').value;
            if (appVersion) manifestVersion = appVersion;

            try {
                const formData = new FormData();
                formData.append('story', JSON.stringify(storyData));
                if (appVersion) formData.append('appVersion', appVersion);

                if (audioFile) {
                    formData.append('audio', audioFile, audioFile.name);
                }
                if (imageFile) {
                    formData.append('image', imageFile, imageFile.name);
                }

                let url = `${API_BASE}/stories`;
                let method = 'POST';

                if (editingStoryId) {
                    url += `/${editingStoryId}`;
                    method = 'PUT';
                } else {
                    const storyId = document.getElementById('storyForm').dataset.storyId;
                    if (!storyId) throw new Error('Story ID not set');
                    storyData.id = storyId;
                    formData.set('story', JSON.stringify(storyData));
                }

                const response = await fetch(url, { method, body: formData });
                
                if (!response.ok) throw new Error('Server error');

                showAlert(editingStoryId ? t('success-update') : t('success-add'), 'success');
                resetForm();
                loadStories();
            } catch (err) {
                showAlert(t('error-server'), 'error');
                console.error('Error:', err);
            }
        });

        function resetForm() {
            document.getElementById('storyForm').reset();
            document.getElementById('storyForm').dataset.storyId = '';
            document.getElementById('audioUpload').classList.remove('has-file');
            document.getElementById('imageUpload').classList.remove('has-file');
            document.getElementById('audioName').textContent = '';
            document.getElementById('imageName').textContent = '';
            document.getElementById('currentAudio').textContent = '';
            document.getElementById('currentImage').textContent = '';
            document.getElementById('publishedDate').valueAsDate = new Date();
            
            document.getElementById('title-form').textContent = t('title-form');
            document.getElementById('btn-submit').textContent = t('btn-add');
            document.getElementById('btn-cancel').classList.add('hidden');
            
            editingStoryId = null;
        }

        async function loadStories() {
            try {
                const response = await fetch(`${API_BASE}/stories`);
                if (!response.ok) throw new Error('Failed to load');
                
                const data = await response.json();
                stories = data.stories || [];
                manifestVersion = data.appVersion || '1.0';
                renderStories();
            } catch (err) {
                showAlert(t('error-server'), 'error');
                console.error('Error:', err);
            }
        }

        function renderStories() {
            const list = document.getElementById('storiesList');

            if (stories.length === 0) {
                list.innerHTML = `<div class="empty-state">${t('empty-state')}</div>`;
                document.getElementById('totalStories').textContent = '0';
                document.getElementById('aiStories').textContent = '0';
                document.getElementById('appVersion').textContent = manifestVersion;
                return;
            }

            list.innerHTML = `
                <table class="stories-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Language</th>
                            <th>Date</th>
                            <th>Age Range</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${stories.map(story => `
                            <tr>
                                <td><strong>${story.title}</strong></td>
                                <td><span class="badge language">${story.language.toUpperCase()}</span></td>
                                <td>${new Date(story.publishedDate).toLocaleDateString(currentLanguage === 'fr' ? 'fr-FR' : 'en-US')}</td>
                                <td>${story.ageMin || story.ageMax ? `${story.ageMin || '0'}-${story.ageMax || '∞'}` : '-'}</td>
                                <td>${story.ai ? '<span class="badge ai">🤖 AI</span>' : '📖'}</td>
                                <td>
                                    <div class="story-actions">
                                        <button class="btn-edit" onclick="editStory('${story.id}')">✏️ Edit</button>
                                        <button class="btn-delete" onclick="confirmDelete('${story.id}')">🗑️ Delete</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('totalStories').textContent = stories.length;
            document.getElementById('aiStories').textContent = stories.filter(s => s.ai).length;
            document.getElementById('appVersion').textContent = manifestVersion;
        }

        function editStory(storyId) {
            const story = stories.find(s => s.id === storyId);
            if (!story) return;

            document.getElementById('storyTitle').value = story.title;
            document.getElementById('storyLanguage').value = story.language;
            document.getElementById('isAi').checked = story.ai;
            document.getElementById('publishedDate').value = story.publishedDate;
            document.getElementById('ageMin').value = story.ageMin || '';
            document.getElementById('ageMax').value = story.ageMax || '';

            document.getElementById('currentAudio').textContent = `Current: ${story.audioFile}`;
            document.getElementById('currentImage').textContent = `Current: ${story.imageFile}`;

            document.getElementById('title-form').textContent = '✏️ Edit Story';
            document.getElementById('btn-submit').textContent = '💾 Update Story';
            document.getElementById('btn-cancel').classList.remove('hidden');

            editingStoryId = storyId;
            document.getElementById('storyTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function confirmDelete(storyId) {
            if (confirm(currentLanguage === 'en' ? 'Delete this story?' : 'Supprimer cette histoire?')) {
                deleteStory(storyId);
            }
        }

        async function deleteStory(storyId) {
            try {
                const response = await fetch(`${API_BASE}/stories/${storyId}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete');

                showAlert(t('success-delete'), 'success');
                loadStories();
            } catch (err) {
                showAlert(t('error-server'), 'error');
                console.error('Error:', err);
            }
        }

        function cancelEdit() {
            resetForm();
        }

        function downloadManifest() {
            const manifest = {
                appVersion: manifestVersion,
                stories: stories
            };

            const json = JSON.stringify(manifest, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'manifest.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialize
        setLanguage('en');
        loadStories();

        // Show server connection info
        console.log('🚀 Aroli Story Manager connected to http://localhost:3000');
    </script>
</body>
</html>
