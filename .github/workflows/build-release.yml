name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0, v1.1, etc.
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -q

      - name: Find APK file
        id: find_apk
        run: |
          echo "Searching for APK files..."
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk directory found"
          
          # Try release build first
          if find app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -1; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
            echo "Found release APK: $APK_PATH"
          elif find app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -1; then
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
            echo "Found debug APK: $APK_PATH"
          elif find . -name "*.apk" -type f 2>/dev/null | head -1; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
            echo "Found APK in workspace: $APK_PATH"
          else
            echo "ERROR: No APK file found!"
            ls -R app/build/outputs/ 2>/dev/null || echo "Build outputs not found"
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="${{ github.ref_name }}"
          APK_FILE="${{ steps.find_apk.outputs.APK_PATH }}"
          
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file not found: $APK_FILE"
            exit 1
          fi
          
          echo "Creating release $TAG_NAME with APK: $APK_FILE"
          
          # Check if release already exists
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo "Release $TAG_NAME already exists. Deleting it..."
            gh release delete "$TAG_NAME" -y
          fi
          
          # Create new release with APK
          gh release create "$TAG_NAME" "$APK_FILE" --generate-notes
          echo "✅ Release created successfully!"

      - name: Upload APK as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aroli-apk
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 30
