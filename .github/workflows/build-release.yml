name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0, v1.1, etc.
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -q

      - name: Find APK file
        id: find_apk
        run: |
          echo "Searching for APK files..."
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk directory found"
          
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f -print -quit 2>/dev/null || true)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file found!"
            ls -R app/build/outputs/ 2>/dev/null || echo "Build outputs not found"
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="${{ github.ref_name }}"
          APK_FILE="${{ steps.find_apk.outputs.APK_PATH }}"
          
          echo "Creating release for tag: $TAG_NAME"
          echo "APK file: $APK_FILE"
          
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "❌ ERROR: APK file not found: $APK_FILE"
            exit 1
          fi
          
          echo "File size: $(du -h "$APK_FILE")"
          
          # Check if release already exists
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo "Release $TAG_NAME already exists. Deleting and recreating..."
            gh release delete "$TAG_NAME" -y || true
            sleep 2
          fi
          
          # Create new release with APK and install scripts
          echo "Creating new release..."
          gh release create "$TAG_NAME" "$APK_FILE" "install.bat" "install.sh" --generate-notes --title "Aroli Release $TAG_NAME"
          
          echo "✅ Release created successfully!"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"

      - name: Upload APK as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aroli-apk
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 30
