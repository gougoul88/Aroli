name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0, v1.1, etc.
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Find APK file
        id: find_apk
        run: |
          APK_PATH=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found, trying debug build..."
            APK_PATH=$(find . -name "app-debug.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK file found at: $APK_PATH"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${{ github.ref_name }}
          APK_FILE="${{ steps.find_apk.outputs.APK_PATH }}"
          
          # Check if release exists
          if gh release view "$TAG_NAME" 2>/dev/null; then
            echo "Release $TAG_NAME already exists, uploading APK..."
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" "$APK_FILE" --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: aroli-apk
          path: ${{ steps.find_apk.outputs.APK_PATH }}
